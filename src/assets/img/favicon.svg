<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pikes Peak Web Designs">
  <!--
    Stacked PPWD wordmark. PP white on top, WD gold on bottom, on the
    navy brand tile. Playfair Display 700 to match the site wordmark;
    Georgia fallback covers any renderer where the embedded woff2
    (injected by scripts/generate-favicons.mjs for Puppeteer; loaded
    by browsers viewing this SVG directly via the metrics-matched
    PlayfairFallback face) is absent. textLength on both rows
    normalises the visual width so PP and WD feel like one block.

    The embedded @media rule swaps to a deeper navy tile and a
    brighter gold for dark browser UI (Safari, Firefox, Chrome 100+
    respect prefers-color-scheme inside an SVG referenced from a
    <link rel="icon">). Browsers that don't query it just see the
    light-mode defaults, which read fine on either UI anyway.
  -->
  <style>
    .tile { fill: #0A1F44; }
    .pp   { fill: #FFFFFF; }
    .wd   { fill: #DDB13D; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #05102A; }
      .wd   { fill: #EBCD6D; }
    }
  </style>
  <rect class="tile" width="512" height="512" rx="80" ry="80"/>
  <text class="pp" x="256" y="252" text-anchor="middle"
        font-family="'Playfair Display', 'PlayfairFallback', Georgia, serif"
        font-weight="700"
        font-size="240"
        textLength="340"
        lengthAdjust="spacingAndGlyphs">PP</text>
  <text class="wd" x="256" y="436" text-anchor="middle"
        font-family="'Playfair Display', 'PlayfairFallback', Georgia, serif"
        font-weight="700"
        font-size="240"
        textLength="340"
        lengthAdjust="spacingAndGlyphs">WD</text>
</svg>
