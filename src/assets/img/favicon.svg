<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pikes Peak Web Designs">
  <defs>
    <!-- Navy tile: soft radial light from upper-left for depth without losing
         the flat-tile feel. Reads like polished enamel rather than a sticker. -->
    <radialGradient id="ppTile" cx="28%" cy="22%" r="95%">
      <stop offset="0"    stop-color="#16305C"/>
      <stop offset="0.55" stop-color="#0A1F44"/>
      <stop offset="1"    stop-color="#06132E"/>
    </radialGradient>

    <!-- Gold "P" gradient: brushed-brass feel. Cool highlight at the very top,
         brand gold at midpoint, deeper amber at the foot. -->
    <linearGradient id="ppGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFEAA8"/>
      <stop offset="0.18" stop-color="#F0CE6E"/>
      <stop offset="0.55" stop-color="#DDB13D"/>
      <stop offset="0.85" stop-color="#B58820"/>
      <stop offset="1"    stop-color="#8E6612"/>
    </linearGradient>

    <!-- Subtle inner sheen across the top half of the P (polished-metal cue). -->
    <linearGradient id="ppSheen" x1="0" y1="0" x2="0" y2="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft warm halo behind the P, suggesting glow without using SVG filters
         (filters render inconsistently across browsers at favicon scale). -->
    <radialGradient id="ppHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#FFD56A" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#DDB13D" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#DDB13D" stop-opacity="0"/>
    </radialGradient>

    <!-- The P glyph defined once so the fill and sheen overlay share geometry. -->
    <path id="ppLetter" fill-rule="evenodd" d="
      M 144 88
      L 144 424
      L 220 424
      L 220 280
      L 296 280
      Q 396 280 396 184
      Q 396 88 296 88
      Z
      M 220 152
      L 220 216
      L 288 216
      Q 320 216 320 184
      Q 320 152 288 152
      Z
    "/>
  </defs>

  <!-- Rounded square tile with depth gradient -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#ppTile)"/>

  <!-- Inner glass-edge highlight on the tile (top-left lit edge) -->
  <rect x="3" y="3" width="506" height="506" rx="93" ry="93"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Warm halo behind the glyph (pure radial gradient on a circle, no filter) -->
  <circle cx="270" cy="256" r="230" fill="url(#ppHalo)"/>

  <!-- P in brushed gold -->
  <use href="#ppLetter" fill="url(#ppGold)"/>

  <!-- Polished sheen across the upper half of the same shape -->
  <use href="#ppLetter" fill="url(#ppSheen)"/>

  <!-- Small gold diamond above the bowl: a quiet wordmark cue, kept small so
       it does not muddy the 16px render. -->
  <path d="M 296 50 L 308 64 L 296 78 L 284 64 Z" fill="#F4E4A8" opacity="0.9"/>
</svg>
